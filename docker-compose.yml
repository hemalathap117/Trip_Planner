services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: trip_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - ollama
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/trip_planner
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b

volumes:
  postgres_data:
  ollama_data:
