version: "3.9"

services:
  postgres_test:
    image: postgres:15
    environment:
      POSTGRES_DB: trip_planner_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"  # Different port to avoid conflict with main DB
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data: